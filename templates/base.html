<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Josiah Guenther{% endblock %}</title>
  <meta name="description"
      content="{% block meta_description %}Professional magician in Southern California.{% endblock %}">
  <link rel="icon" type="image/png" href="static/images/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Site-wide stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />

  <!-- Page-specific styles (optional override) -->
  {% block extra_css %}{% endblock %}
  
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Josiah Guenther",
  "url": "https://josiahguenthermagic.com",
  "jobTitle": "Professional Magician",
  "description": "Professional magician performing close-up and stage magic for corporate events, schools, churches, and private parties throughout Southern California.",
  "brand": {
    "@type": "Brand",
    "name": "Josiah Guenther Magic"
  },
  "image": "https://josiahguenthermagic.com/static/images/Josiah Guenther Pro Photo 1.jpg",
  "logo": "https://josiahguenthermagic.com/static/images/favicon.png",
  "email": "josiah@josiahguenthermagic.com",
  "sameAs": [
    "https://www.youtube.com/@JosiahGuentherMagic"
  ],
  "knowsAbout": [
    "Close-up Magic",
    "Strolling Magic",
    "Restaurant Magic",
    "Walkaround Magic",
    "Stage Magic",
    "Corporate Entertainment",
    "School Assemblies",
    "Church Events"
  ],
  "areaServed": {
    "@type": "State",
    "name": "California"
  }
}
  
</script>

</head>
<body>

  <!-- ══ NAVIGATION ══════════════════════════════════════ -->
  <nav>
    <a class="nav-logo" href="{{ url_for('home') }}">Josiah <span>Guenther</span></a>
    <div class="nav-links">
      <a class="nav-btn {% if active_page == 'home'     %}active{% endif %}" href="{{ url_for('home')     }}">Home</a>
      <a class="nav-btn {% if active_page == 'services' %}active{% endif %}" href="{{ url_for('services') }}">Services</a>
      <a class="nav-btn {% if active_page == 'contact'  %}active{% endif %}" href="{{ url_for('contact')  }}">Contact</a>
    </div>
  </nav>

  <!-- ══ PAGE CONTENT ════════════════════════════════════ -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ══ FOOTER ══════════════════════════════════════════ -->
  <footer>

  <h2 class="footer-name">Josiah Guenther</h2>

  <p class="footer-tagline">Your Guide to Wonderland</p>

  <div class="footer-contact">
      <p>Email: josiah@josiahguenthermagic.com</p>
      <!-- Uncomment this when you want to add your phone number -->
      <!-- <p>(555) 555-5555</p> -->
  </div>

  <div class="footer-social">

      <a href="https://www.youtube.com/@JosiahGuentherMagic"
         target="_blank"
         rel="noopener"
         aria-label="YouTube">

          <svg viewBox="0 0 24 24">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>

      </a>

  </div>

  <p class="footer-copy">
      © Copyright Josiah Guenther 2026. All rights reserved.
  </p>

</footer>

  <!-- Site-wide JavaScript -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

  <!-- Page-specific scripts (optional) -->
  {% block extra_js %}{% endblock %}

</body>
</html>
